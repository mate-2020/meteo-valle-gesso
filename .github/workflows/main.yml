name: Meteo Valle Gesso Giornaliero

on:
  schedule:
    # Programma regolare (esempio: 07:00 UTC = 09:00 IT estate / 08:00 IT inverno)
    - cron: '0 7 * * *'
  workflow_dispatch:  # Permette trigger manuale dal pulsante "Run workflow"

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests pyproj

      - name: Esegui script meteo (automatico)
        run: python meteo_gesso.py --auto

      - name: Commit e push dei risultati
        run: |
          git config user.name "Meteo Bot"
          git config user.email "bot@users.noreply.github.com"
          git add .
          git commit -m "Report meteo $(date +%Y-%m-%d)" || echo "Niente da committare"
          git push
